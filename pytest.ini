[pytest]
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::DeprecationWarning
markers =
    perf: 机器速度相关的门槛（吞吐 nps / 实际到达深度）。这类门槛测的是
        "引擎有没有退化"，而退化与"这台机器多快"在数字上无法分开 ——
        CI runner 比开发机慢，同一份代码在两边会得出不同结论。
        CI 用 `-m "not perf"` 跳过，本地跑全量。正确性与时间合规类
        用例**不打这个标记**，它们在任意机器上都该通过。
