name: Build and Release

on:
  # **只在打 tag 时自动跑。** 早先这里还有 `branches: ['**']`，而 GitHub 把
  # "推分支"与"推 tag"当成**两个独立事件** —— 一次发版于是起两条 run：一条跟
  # 着 main 那次推送，只跑 test（build-linux 与 release 都被 `refs/tags/` 挡
  # 着），一条跟着 tag，跑四架构并发布。发版时没有人想看前一条，手动取消又会
  # 在 Actions 列表里留一条 cancelled，于是干脆不触发它。
  #
  # 代价要如实说：**改坏了不再在"推送时"被拦住，而是等到打 tag 时才暴露** ——
  # `test` 那条从"每次 push 都跑"变成"发版前跑一次"（它仍是 `release` 的
  # needs，所以烂代码发不出去，只是发现得晚）。想在推送时就验，用下面那条
  # 手动 dispatch（它能跑 test，也能顺带出四架构产物）。
  push:
    tags: ['v*']
  # PR 保留着：它不因推 main 而触发（这个仓库平时也不开 PR），但万一哪天真
  # 开了分支，合并前那次"改坏了"仍能被挡住。不要了删掉这一行即可。
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: '同时构建 Windows 产物（未经验证，不进 Release）'
        type: boolean
        default: false
      # 手动 dispatch 时常常只想要一份给自己机器用的产物，四个架构全跑是纯
      # 浪费（armv7 那条还要走 QEMU）。**tag 推送不受这个输入影响** —— 发版
      # 必须四个架构齐全，这个开关只服务于手动跑。矩阵怎么被它裁掉见
      # `plan-linux` 那段注释。
      linux:
        description: 'Linux 矩阵跑几格（tag 推送永远跑全四格）'
        type: choice
        default: all
        options:
          - all
          - amd64
          - none

permissions:
  contents: write

# ============================================================================
#  产物清单（Linux 四架构 × 安装包 + 裸可执行文件 = 8）
#
#  名字是四格：GomokuAI_Linux_<家族>_<位数>_<run|setup>.<后缀>
#
#    GomokuAI_Linux_AMD_x86_64_run     GomokuAI_Linux_AMD_x86_64_setup.deb
#    GomokuAI_Linux_AMD_x86_32_run     GomokuAI_Linux_AMD_x86_32_setup.deb
#    GomokuAI_Linux_ARM_arm64_run      GomokuAI_Linux_ARM_arm64_setup.tar.gz
#    GomokuAI_Linux_ARM_arm32_run      GomokuAI_Linux_ARM_arm32_setup.tar.gz
#
#  **家族与位数必须是两格。** 早先是 `GomokuAI_For_Linux_<SUFFIX>`，SUFFIX ∈
#  AMD / X86 / ARM / ARM32 —— 一格既当族名又当位数，而位数恰恰是最容易装错的
#  那个信息：`AMD` 与 `X86` 都是 x86 家族（一个 64 位一个 32 位），`ARM` 与
#  `ARM32` 同理，光看名字分不出谁是谁，下错就是一句 `Exec format error`。
#  而且 `X86` 撞上"x86 默认指 32 位"的惯例，`AMD` 又让 Intel 用户以为与己无关
#  （那正是他们该下的那份）。现在 `AMD_x86_64` 与 `AMD_x86_32` 一眼可辨。
#
#  家族名 AMD 覆盖整个 x86 家族（含 Intel 与虚拟机），ARM 覆盖整个 ARM 家族；
#  位数那格两族各用本名，不复用对方的词。
#
#  **Windows 不在 Release 里。** 项目只在 Linux 上开发与验证，Windows 那份
# 适配没有实测过，也没有人能验证 —— 把没验证过的产物放进 Release，等于让
# 用户去当测试。那个 job 保留着，但只在手动 dispatch 时跑，见下面 `windows`。
#
#  安装包形态按指令集分工：x86 系给 `.deb`（Debian/Ubuntu 的装机主力），
#  ARM 系给 `.tar.gz`（tar + install.sh，不绑定发行版 —— ARM 上跑什么发行版
#  的都有，树莓派、Fedora ARM、Arch ARM 各不相同）。这是沿用 v2.x 的既有
#  分工，没有改动已有产物的形态；只有后缀从 `.pkg` 改成了 `.tar.gz` ——
#  `.pkg` 是 macOS 的安装包扩展名，Linux 上并不存在这种格式，用户在 Linux
#  的下载页上看见它会去找 `installer` 命令。
#
#  **每个包都内嵌 C++ 计算核心。** v2.x 的三个 job 都漏了这件事（既不跑
#  CMake 也不带 --add-binary），于是 Release 上每一个产物都是纯 Python 引擎版，
#  4/5 档全靠 engine_local 兜底 —— 而 config._candidates() 第一候选就是
#  `_MEIPASS/gomoku_engine`，设计上本来就要求它进包。配方见
#  packaging/build_in_container.sh 的 ②④ 两段。
# ============================================================================

jobs:

  # ============================================================
  #  测试 — 打 tag / PR / 手动 dispatch 时跑
  #
  #  **它是发布闸门，不是每次提交的哨兵。** `release` 的 `needs` 里有它，所以
  #  测试红了就发不出去 —— 这是它今天最主要的作用（`build-linux` 只跑 C++ 自
  #  检，全程不跑一条 pytest：能编过与棋是对的，是两件事）。
  #
  #  它**不在关键路径上**：三个版本并行、各 7 分钟，而 armv7 那条构建要 11 分
  #  钟，删掉它一分钟也省不下来。
  #
  #  独立成 job 而不是塞进打包 job：打包那些只在 tag 或 dispatch 时触发，而
  #  "改坏了但还没发版"同样该被挡住 —— 它们跑的是同一份源码。三条 Qt 用例只
  #  import 不构造 QApplication，因此无需 display 即可跑完。
  # ============================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三个版本各有来路，都不是凑数：
        #   3.11 = Debian bookworm 的系统 Python，**四个架构的产物都是用它建的**
        #          （打包统一走 bookworm 容器，见 packaging/）
        #   3.12 = ubuntu-24.04 runner 的系统 Python，开发机的 venv 通常是它
        #   3.13 = 开发环境实际在跑的版本
        # 发出去的与开发的都覆盖到；中间那个 3.12 之所以留着，是因为它正是
        # runner 上 `python3` 的版本，本地开发也多半是它。
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 依赖清单只有 requirements*.txt 一处，不再在这里重复列举 ——
        # 早先四个 job 各写一行 pip install，加一个依赖要改四处，漏掉一处
        # 就得到"本地过了 CI 挂"的假象。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        # -m "not perf"：跳过依赖机器速度的门槛（吞吐 nps / 到达深度）。
        # 那些门槛在开发机上是有效哨兵，在更慢的 runner 上只会变成随机红。
        # 正确性、增量一致性、时间合规、题库、VCF、棋型这些**全部保留**。
        run: python -m pytest -q -m "not perf"


  # ============================================================
  #  Linux 矩阵的定义
  #
  #  **为什么单起一个 job 产出矩阵**，而不是让下面 `build-linux` 自己写
  #  `matrix.include`：手动 dispatch 时常常只想要一格给自己用（见
  #  `inputs.linux`），而"只跑其中几格"在这套 YAML 里没有干净的写法 ——
  #
  #    * job 级 `if` **读不到 `matrix`**（可用的上下文只有 github / needs /
  #      vars / inputs），所以没法在 job 上判"这一格要不要跑"；
  #    * `exclude` 对 include-only 的矩阵**无效**：GitHub 明确规定 `include`
  #      在 `exclude` **之后**处理（正是这条让 `include` 能把排除掉的格子
  #      加回来），于是刚被踢掉的格子会被 `include` 原样重建；
  #    * step 级 `if` 读得到 `matrix`，但四格仍会各起一个 runner —— 三个
  #      空转的 job、三条绿色的勾，比不裁还难看。
  #
  #  剩下唯一能在矩阵展开**之前**动手的位置，就是这个 JSON 串本身。
  #  **tag 推送永远给全四格**（发版必须齐全），这个开关只服务于手动跑；
  #  `inputs.linux == 'none'` 时本 job 跳过，`build-linux` 随之跳过。
  # ============================================================
  plan-linux:
    # 与下面 `build-linux` 的守卫**逐字对齐**：本 job 被跳过时那边也会被跳过
    # （`needs` 指向一个跳过的 job），两边条件一旦错开，就会出现"plan 跑了、
    # build 没跑"或者反过来的半截状态。PR 上两条都不跑。
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && inputs.linux != 'none')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        run: |
          # 每格一行 JSON。各键的含义：family / bits 就是产物名前两格（见
          # 文件头的产物清单），ext / deb_arch 决定第 ⑤ 段走哪条配方。
          #
          # `qemu` 必须是**布尔**而不是字符串 —— 字符串 "false" 在 step 的
          # `if: matrix.qemu` 里是真值，QEMU 注册那一步就会在四条架构上全跑。
          #
          # arm64：原生 arm64 runner，比在 x86 上跑 QEMU 快一个数量级。
          # i386： 不需要 QEMU，x86 主机内核自带 32 位 ELF 支持，宿主 CPU
          #        直接执行，只是换了一套 32 位 userland。
          # armv7：唯独这一条必须翻译执行。
          amd64='{"name":"amd64","family":"AMD","bits":"x86_64","platform":"linux/amd64","runs_on":"ubuntu-latest","qemu":false,"ext":"deb","deb_arch":"amd64"}'
          arm64='{"name":"arm64","family":"ARM","bits":"arm64","platform":"linux/arm64","runs_on":"ubuntu-24.04-arm","qemu":false,"ext":"tar.gz","deb_arch":"arm64"}'
          i386='{"name":"i386","family":"AMD","bits":"x86_32","platform":"linux/386","runs_on":"ubuntu-latest","qemu":false,"ext":"deb","deb_arch":"i386"}'
          armv7='{"name":"armv7","family":"ARM","bits":"arm32","platform":"linux/arm/v7","runs_on":"ubuntu-latest","qemu":true,"ext":"tar.gz","deb_arch":"armhf"}'
          # tag 推送时 `inputs.linux` 是空串，落进 `*` 那一支 —— 正是发版要的。
          case "${{ inputs.linux }}" in
            amd64) list="$amd64" ;;
            *)     list="$amd64,$arm64,$i386,$armv7" ;;
          esac
          echo "include=[$list]" >> "$GITHUB_OUTPUT"


  # ============================================================
  #  Linux 四架构 — 一个矩阵，四份配方同一份脚本
  #
  #  为什么全都在容器里建（而不是像 v2.x 那样用 runner 自带的解释器）：
  #  **PyInstaller 不能交叉编译**。amd64 runner 上建不出 i386 与 armv7 的
  #  二进制，必须换 userland；四个架构因此统一走 bookworm 容器，产物也就
  #  统一是 Python 3.11 建的。armv7 再叠一层 QEMU（没有 32 位 ARM runner）。
  #
  #  `fail-fast: false` 是刻意的：32 位那两条是这套流程里最新的部分，一个
  #  架构挂了不应该把另外三个的诊断信息一起吃掉。
  #
  #  矩阵不写在这里 —— 见上面的 `plan-linux`（含"为什么"）。
  # ============================================================
  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: plan-linux
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-linux.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        # 四个架构与 release job 都要这个号码，只算一次 —— 与 requirements
        # 清单同一个理由：同一个事实写在多处，改一处漏一处就会得到版本号
        # 不一致的两份产物。
        run: |
          raw="${GITHUB_REF_NAME}"
          if [[ "$raw" =~ ^v[0-9] ]]; then ver="${raw#v}"
          elif [[ "$raw" =~ ^[0-9] ]]; then ver="$raw"
          else ver="0.0.0"; fi
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "版本号: $ver"

      - name: Set up QEMU
        # 只在 armv7 那条上跑。注册 binfmt 处理器之后，宿主内核就能执行
        # 容器里的 armv7 指令。
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Build inside ${{ matrix.name }} container
        env:
          FAMILY: ${{ matrix.family }}
          BITS: ${{ matrix.bits }}
          EXT: ${{ matrix.ext }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e FAMILY -e BITS -e EXT -e DEB_ARCH -e APP_VERSION \
            debian:bookworm \
            bash packaging/build_in_container.sh

      - name: Fix ownership
        # 容器里是 root，挂载出来的文件在宿主上就是 root 所有。runner 用户
        # 读得到但删不掉 —— 不修的话下面 upload 之后的清理步骤会莫名其妙
        # 地失败，而且报错与真正的原因隔了好几层。
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.family }}_${{ matrix.bits }}_installer
          path: GomokuAI_Linux_${{ matrix.family }}_${{ matrix.bits }}_setup.${{ matrix.ext }}

      - name: Upload standalone executable
        # 注意：artifact 这一趟**不带可执行位**（upload-artifact 只存字节），
        # 所以用户下到的文件必须自己 `chmod +x`。Release 资产本来也没有权限
        # 这回事，不用额外处理 —— 只在 README 里说清楚。
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.family }}_${{ matrix.bits }}_run
          path: dist/GomokuAI_Linux_${{ matrix.family }}_${{ matrix.bits }}_run


  # ============================================================
  #  Windows — 不进 Release，默认也不跑
  #
  #  项目只在 Linux 上开发与验证，Windows 适配没有实测过。两道门都刻意挡着：
  #  tag 不触发（产物漏不进 Release），手动 dispatch 也要显式勾
  #  `build_windows` 才跑 —— 否则每次验证 Linux 四架构都会多挂一个已知会红的
  #  job，噪声正好盖住真正要看的信号。
  #
  #  保留而不是删掉：Inno Setup 那份配方（installer/GomokuAI.iss）是能用的，
  #  等 Windows 侧真正验证过之后，把这行 `if` 改成 tag 条件就能重新进 Release。
  # ============================================================
  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build C++ engine
        # 与 Linux 侧同样的理由：不把引擎带进包，4/5 档就退回本地 Python
        # 参考实现。Windows 上 CMake 与 MSVC 是 runner 自带的。
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release -j
          # **`.\` 不能省。** PowerShell 与 bash 不同：它不把当前目录放进
          # 可执行文件的搜索路径，`cpp\build\...` 会被当成模块名去 Import，
          # 报 "The module 'cpp' could not be loaded"（这一步曾经编译失败时
          # 顺带暴露了它，两处都是第一次在这套流程上真跑）。
          .\cpp\build\Release\gomoku_engine.exe --verify-tables --selftest

      - name: Resolve version
        shell: pwsh
        run: |
          $raw = '${{ github.ref_name }}'
          $ver = if ($raw -match '^v[0-9]') { $raw.Substring(1) } elseif ($raw -match '^[0-9]') { $raw } else { '0.0.0' }
          "APP_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "版本号: $ver"

      - name: Build (onedir)
        run: |
          pyinstaller --onedir --windowed --icon="五子棋.ico" --name "GomokuAI" `
            --add-binary "cpp\build\Release\gomoku_engine.exe;." main.py

      - name: Build portable (onefile)
        run: |
          pyinstaller --onefile --windowed --icon="五子棋.ico" --name "GomokuAI_Portable" `
            --add-binary "cpp\build\Release\gomoku_engine.exe;." main.py

      - name: Install Inno Setup
        # choco 装的是当前最新版。**不假设它带简体中文语言文件** —— Inno
        # Setup 从 6.3 起才官方收录 ChineseSimplified.isl，而 `MessagesFile`
        # 指向不存在的文件是编译期硬错，猜错的代价是整步失败。
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC：$iscc" }

          $isccArgs = @("/DAppVersion=$env:APP_VERSION")
          if (Test-Path (Join-Path (Split-Path $iscc -Parent) "Languages\ChineseSimplified.isl")) {
            Write-Host "编译器自带中文语言文件，安装向导显示中文"
            $isccArgs += "/DHasChinese=1"
          } else {
            Write-Warning "编译器没有 ChineseSimplified.isl，安装向导退回英文"
          }
          $isccArgs += "installer\GomokuAI.iss"

          & $iscc @isccArgs
          $setup = Get-ChildItem "dist-installer\GomokuAI_Windows_AMD_x86_64_setup_testing.exe"
          if (-not $setup) { throw "ISCC 退出码为 0 却没有产出安装包" }
          $setup | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Collect portable artifact
        shell: pwsh
        run: Copy-Item "dist\GomokuAI_Portable.exe" "GomokuAI_Windows_AMD_x86_64_run_testing.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows_AMD_x86_64_setup_testing
          path: dist-installer/GomokuAI_Windows_AMD_x86_64_setup_testing.exe

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: windows_AMD_x86_64_run_testing
          path: GomokuAI_Windows_AMD_x86_64_run_testing.exe


  # ============================================================
  #  GitHub Release (仅 tag 推送时触发)
  # ============================================================
  release:
    # `test` 必须在这里 —— 否则测试挂了照样能发版（four build job 都不依赖它，
    # 而 `softprops/action-gh-release` 也不看测试结果）。CI 跑的是
    # `-m "not perf"`，所以这条闸门不受 runner 快慢影响。
    needs:
      - test
      - build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: List release files
        run: ls -lah release/

      - name: Assert the release holds exactly these 8 assets
        # **数一遍再发。** 四个 build job 里任何一个被跳过（`if` 写错、架构
        # 不可用）都不会让这个 job 失败 —— `needs` 只保证"跑过的那些成功"，
        # 挡不住"某一条压根没跑"。少了产物的 Release 会静默地只发 6 个，
        # 用户下不到自己架构那份，而错误现场在几周后才会出现。
        #
        # **这里是 8 个名字逐个写死的，不是通配符。** 早先那版是
        # `for s in AMD ARM X86 ARM32; do [ -e "release/GomokuAI_For_Linux_$s" ] …`
        # 那一套，两处都踩过：① 匹配用的是 `"…$s".*`，而 `.*` 是在**当前目录**
        # （$GITHUB_WORKSPACE，本 job 没有 checkout，因而是空目录）里展开的，
        # 没有匹配就原样留成一个字面量 `*`，`-e` 永远为假 —— 8 个资产**明明
        # 全在**，发布会栽在一条假报警上（v3.0.1 首次实跑就是这么红的）；
        # ② 就算把前缀补对，`.*` 也放过了任何后缀，`.deb` 换成 `.rpm` 照样
        # 绿。逐个写死两个毛病一起消掉：名字、后缀、数量全在一条 `diff` 里。
        run: |
          want=$(printf '%s\n' \
            GomokuAI_Linux_AMD_x86_64_run \
            GomokuAI_Linux_AMD_x86_64_setup.deb \
            GomokuAI_Linux_AMD_x86_32_run \
            GomokuAI_Linux_AMD_x86_32_setup.deb \
            GomokuAI_Linux_ARM_arm64_run \
            GomokuAI_Linux_ARM_arm64_setup.tar.gz \
            GomokuAI_Linux_ARM_arm32_run \
            GomokuAI_Linux_ARM_arm32_setup.tar.gz | sort)
          got=$(ls -1 release/ | sort)
          echo "Release 资产：$(printf '%s\n' "$got" | wc -l) 个"
          printf '%s\n' "$got"
          if [ "$want" != "$got" ]; then
            echo "!! Release 资产与预期不符" >&2
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") >&2 || true
            echo "   （左 = 应有，右 = 实际；4 架构 × 安装包/裸可执行 = 8）" >&2
            exit 1
          fi
          echo "8 个资产齐全，四架构各一份安装包 + 一份裸可执行文件"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ github.ref_name }}"
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
