name: Build and Release

on:
  # **只在打 tag 时自动跑。** 早先这里还有 `branches: ['**']`，而 GitHub 把
  # "推分支"与"推 tag"当成**两个独立事件** —— 一次发版于是起两条 run：一条跟
  # 着 main 那次推送，只跑 test（build-linux 与 release 都被 `refs/tags/` 挡
  # 着），一条跟着 tag，跑四架构并发布。发版时没有人想看前一条，手动取消又会
  # 在 Actions 列表里留一条 cancelled，于是干脆不触发它。
  #
  # 代价要如实说：**改坏了不再在"推送时"被拦住，而是等到打 tag 时才暴露** ——
  # `test` 那条从"每次 push 都跑"变成"发版前跑一次"（它仍是 `release` 的
  # needs，所以烂代码发不出去，只是发现得晚）。想在推送时就验，用下面那条
  # 手动 dispatch（它能跑 test，也能顺带出四架构产物）。
  push:
    tags: ['v*']
  # PR 保留着：它不因推 main 而触发（这个仓库平时也不开 PR），但万一哪天真
  # 开了分支，合并前那次"改坏了"仍能被挡住。不要了删掉这一行即可。
  pull_request:
  workflow_dispatch:
    inputs:
      build_windows:
        description: '同时构建 Windows 产物（未经验证，不进 Release）'
        type: boolean
        default: false
      # 手动 dispatch 时常常只想要一份给自己机器用的产物，四个架构全跑是纯
      # 浪费（armv7 那条还要走 QEMU）。**tag 推送不受这个输入影响** —— 发版
      # 必须四个架构齐全，这个开关只服务于手动跑。矩阵怎么被它裁掉见
      # `plan-linux` 那段注释。
      linux:
        description: 'Linux 矩阵跑几格（tag 推送永远跑全四格）'
        type: choice
        default: all
        options:
          - all
          - amd64
          - none

permissions:
  contents: write

# ============================================================================
#  产物清单（Linux 四架构 × 3 + Windows × 3 = 15）
#
#  名字是：GomokuAI_<平台>_<stem>_<run|setup>[_debug|_play].<后缀>
#
#    GomokuAI_Linux_amd_x86_64_run_debug   GomokuAI_Linux_amd_x86_64_setup.deb
#    GomokuAI_Linux_amd_x86_64_run_play
#    GomokuAI_Linux_amd_x32_run_debug      GomokuAI_Linux_amd_x32_setup.deb
#    GomokuAI_Linux_amd_x32_run_play
#    GomokuAI_Linux_aarch64_run_debug      GomokuAI_Linux_aarch64_setup.tar.gz
#    GomokuAI_Linux_aarch64_run_play
#    GomokuAI_Linux_armv7_run_debug        GomokuAI_Linux_armv7_setup.tar.gz
#    GomokuAI_Linux_armv7_run_play
#    GomokuAI_Windows_amd_x86_64_setup.exe
#    GomokuAI_Windows_amd_x86_64_run_debug.exe
#    GomokuAI_Windows_amd_x86_64_run_play.exe
#
#  **AMD 那一格是族名不是型号** —— Intel 机器与虚拟机下的都是同一份。
#  **ARM 把家族与位数合并成一个 token**（`aarch64` / `armv7`）：`arm_x86_64`
#  这种组合自相矛盾 —— ARM 哪来的 x86 位数。
#
#  **只有 run 带 debug/play 后缀**，setup 不带（安装包装的是 play，见
#  gamelog.py 顶部）。这是这套命名存在的理由：此前"留不留日志"由平台暗定
#  （Windows 打包版写、Linux 打包版不写），用户看不出手上这份是哪一种。
#
#  早先是 `GomokuAI_For_Linux_<SUFFIX>`，SUFFIX ∈ AMD / X86 / ARM / ARM32 ——
#  一格既当族名又当位数，而位数恰恰是最容易装错的那个信息，光看名字分不出
#  谁是谁，下错就是一句 `Exec format error`。
#
#  安装包形态按指令集分工：x86 系给 `.deb`（Debian/Ubuntu 的装机主力），
#  ARM 系给 `.tar.gz`（tar + install.sh，不绑定发行版 —— ARM 上跑什么发行版
#  的都有，树莓派、Fedora ARM、Arch ARM 各不相同）。这是沿用 v2.x 的既有
#  分工，没有改动已有产物的形态；只有后缀从 `.pkg` 改成了 `.tar.gz` ——
#  `.pkg` 是 macOS 的安装包扩展名，Linux 上并不存在这种格式，用户在 Linux
#  的下载页上看见它会去找 `installer` 命令。
#
#  **每个包都内嵌 C++ 计算核心。** v2.x 的三个 job 都漏了这件事（既不跑
#  CMake 也不带 --add-binary），于是 Release 上每一个产物都是纯 Python 引擎版，
#  4/5 档全靠 engine_local 兜底 —— 而 config._candidates() 第一候选就是
#  `_MEIPASS/gomoku_engine`，设计上本来就要求它进包。配方见
#  packaging/build_in_container.sh 的 ②④ 两段。
# ============================================================================

jobs:

  # ============================================================
  #  测试 — 打 tag / PR / 手动 dispatch 时跑
  #
  #  **它是发布闸门，不是每次提交的哨兵。** `release` 的 `needs` 里有它，所以
  #  测试红了就发不出去 —— 这是它今天最主要的作用（`build-linux` 只跑 C++ 自
  #  检，全程不跑一条 pytest：能编过与棋是对的，是两件事）。
  #
  #  它**不在关键路径上**：三个版本并行、各 7 分钟，而 armv7 那条构建要 11 分
  #  钟，删掉它一分钟也省不下来。
  #
  #  独立成 job 而不是塞进打包 job：打包那些只在 tag 或 dispatch 时触发，而
  #  "改坏了但还没发版"同样该被挡住 —— 它们跑的是同一份源码。三条 Qt 用例只
  #  import 不构造 QApplication，因此无需 display 即可跑完。
  # ============================================================
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 三个版本各有来路，都不是凑数：
        #   3.11 = Debian bookworm 的系统 Python，**四个架构的产物都是用它建的**
        #          （打包统一走 bookworm 容器，见 packaging/）
        #   3.12 = ubuntu-24.04 runner 的系统 Python，开发机的 venv 通常是它
        #   3.13 = 开发环境实际在跑的版本
        # 发出去的与开发的都覆盖到；中间那个 3.12 之所以留着，是因为它正是
        # runner 上 `python3` 的版本，本地开发也多半是它。
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 依赖清单只有 requirements*.txt 一处，不再在这里重复列举 ——
        # 早先四个 job 各写一行 pip install，加一个依赖要改四处，漏掉一处
        # 就得到"本地过了 CI 挂"的假象。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        # -m "not perf"：跳过依赖机器速度的门槛（吞吐 nps / 到达深度）。
        # 那些门槛在开发机上是有效哨兵，在更慢的 runner 上只会变成随机红。
        # 正确性、增量一致性、时间合规、题库、VCF、棋型这些**全部保留**。
        run: python -m pytest -q -m "not perf"


  # ============================================================
  #  Linux 矩阵的定义
  #
  #  **为什么单起一个 job 产出矩阵**，而不是让下面 `build-linux` 自己写
  #  `matrix.include`：手动 dispatch 时常常只想要一格给自己用（见
  #  `inputs.linux`），而"只跑其中几格"在这套 YAML 里没有干净的写法 ——
  #
  #    * job 级 `if` **读不到 `matrix`**（可用的上下文只有 github / needs /
  #      vars / inputs），所以没法在 job 上判"这一格要不要跑"；
  #    * `exclude` 对 include-only 的矩阵**无效**：GitHub 明确规定 `include`
  #      在 `exclude` **之后**处理（正是这条让 `include` 能把排除掉的格子
  #      加回来），于是刚被踢掉的格子会被 `include` 原样重建；
  #    * step 级 `if` 读得到 `matrix`，但四格仍会各起一个 runner —— 三个
  #      空转的 job、三条绿色的勾，比不裁还难看。
  #
  #  剩下唯一能在矩阵展开**之前**动手的位置，就是这个 JSON 串本身。
  #  **tag 推送永远给全四格**（发版必须齐全），这个开关只服务于手动跑；
  #  `inputs.linux == 'none'` 时本 job 跳过，`build-linux` 随之跳过。
  # ============================================================
  plan-linux:
    # 与下面 `build-linux` 的守卫**逐字对齐**：本 job 被跳过时那边也会被跳过
    # （`needs` 指向一个跳过的 job），两边条件一旦错开，就会出现"plan 跑了、
    # build 没跑"或者反过来的半截状态。PR 上两条都不跑。
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && inputs.linux != 'none')
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - id: m
        run: |
          # 每格一行 JSON。各键的含义：stem 就是产物名里那一格（见文件头的
          # 产物清单），ext / deb_arch 决定第 ⑤ 段走哪条配方。
          #
          # **`deb_arch` 与 `stem` 是两回事**：前者进 deb 控制文件的
          # `Architecture:` 字段、给 dpkg 看（`i386`），后者给人看
          # （`amd_x32`）。两者的词表不是一套，别想着合并。
          #
          # `qemu` 必须是**布尔**而不是字符串 —— 字符串 "false" 在 step 的
          # `if: matrix.qemu` 里是真值，QEMU 注册那一步就会在四条架构上全跑。
          #
          # aarch64：原生 arm64 runner，比在 x86 上跑 QEMU 快一个数量级。
          # amd_x32：不需要 QEMU，x86 主机内核自带 32 位 ELF 支持，宿主 CPU
          #          直接执行，只是换了一套 32 位 userland。
          # armv7：  唯独这一条必须翻译执行。
          amd64='{"name":"amd64","stem":"amd_x86_64","platform":"linux/amd64","runs_on":"ubuntu-latest","qemu":false,"ext":"deb","deb_arch":"amd64"}'
          arm64='{"name":"arm64","stem":"aarch64","platform":"linux/arm64","runs_on":"ubuntu-24.04-arm","qemu":false,"ext":"tar.gz","deb_arch":"arm64"}'
          i386='{"name":"i386","stem":"amd_x32","platform":"linux/386","runs_on":"ubuntu-latest","qemu":false,"ext":"deb","deb_arch":"i386"}'
          armv7='{"name":"armv7","stem":"armv7","platform":"linux/arm/v7","runs_on":"ubuntu-latest","qemu":true,"ext":"tar.gz","deb_arch":"armhf"}'
          # tag 推送时 `inputs.linux` 是空串，落进 `*` 那一支 —— 正是发版要的。
          case "${{ inputs.linux }}" in
            amd64) list="$amd64" ;;
            *)     list="$amd64,$arm64,$i386,$armv7" ;;
          esac
          echo "include=[$list]" >> "$GITHUB_OUTPUT"


  # ============================================================
  #  Linux 四架构 — 一个矩阵，四份配方同一份脚本
  #
  #  为什么全都在容器里建（而不是像 v2.x 那样用 runner 自带的解释器）：
  #  **PyInstaller 不能交叉编译**。amd64 runner 上建不出 i386 与 armv7 的
  #  二进制，必须换 userland；四个架构因此统一走 bookworm 容器，产物也就
  #  统一是 Python 3.11 建的。armv7 再叠一层 QEMU（没有 32 位 ARM runner）。
  #
  #  `fail-fast: false` 是刻意的：32 位那两条是这套流程里最新的部分，一个
  #  架构挂了不应该把另外三个的诊断信息一起吃掉。
  #
  #  矩阵不写在这里 —— 见上面的 `plan-linux`（含"为什么"）。
  # ============================================================
  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: plan-linux
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-linux.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        # 四个架构与 release job 都要这个号码，只算一次 —— 与 requirements
        # 清单同一个理由：同一个事实写在多处，改一处漏一处就会得到版本号
        # 不一致的两份产物。
        run: |
          raw="${GITHUB_REF_NAME}"
          # **只取开头那段 `x.y.z`**，tag 后面跟什么都行。这个号码会原样进
          # deb 控制文件的 `Version:` 字段，而 deb 的版本号字符集很窄（只允许
          # 字母数字与 `. + - ~ :`，且必须数字开头）——`v3.0.5_windows(testing)`
          # 整个塞进去的话，`_` 和 `()` 都非法，dpkg-deb 会直接报版本号非法，
          # 四个架构一起红。
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then ver="${BASH_REMATCH[1]}"
          elif [[ "$raw" =~ ^v?([0-9]+) ]]; then ver="${BASH_REMATCH[1]}"
          else ver="0.0.0"; fi
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "版本号: $ver（tag: $raw）"

      - name: Set up QEMU
        # 只在 armv7 那条上跑。注册 binfmt 处理器之后，宿主内核就能执行
        # 容器里的 armv7 指令。
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3

      - name: Build inside ${{ matrix.name }} container
        env:
          STEM: ${{ matrix.stem }}
          EXT: ${{ matrix.ext }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "${GITHUB_WORKSPACE}:/src" -w /src \
            -e STEM -e EXT -e DEB_ARCH -e APP_VERSION \
            debian:bookworm \
            bash packaging/build_in_container.sh

      - name: Fix ownership
        # 容器里是 root，挂载出来的文件在宿主上就是 root 所有。runner 用户
        # 读得到但删不掉 —— 不修的话下面 upload 之后的清理步骤会莫名其妙
        # 地失败，而且报错与真正的原因隔了好几层。
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.stem }}_setup
          path: GomokuAI_Linux_${{ matrix.stem }}_setup.${{ matrix.ext }}

      - name: Upload standalone executable (debug)
        # 注意：artifact 这一趟**不带可执行位**（upload-artifact 只存字节），
        # 所以用户下到的文件必须自己 `chmod +x`。Release 资产本来也没有权限
        # 这回事，不用额外处理 —— 只在 README 里说清楚。
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.stem }}_run_debug
          path: dist/GomokuAI_Linux_${{ matrix.stem }}_run_debug

      - name: Upload standalone executable (play)
        uses: actions/upload-artifact@v4
        with:
          name: linux_${{ matrix.stem }}_run_play
          path: dist/GomokuAI_Linux_${{ matrix.stem }}_run_play


  # ============================================================
  #  Windows — 2026-10-02 转正，与 Linux 一样进 Release
  #
  #  此前 tag 不触发这条 job、产物名带 `_testing`，理由是"没有实机验证过，
  #  不该让用户当测试"。现在真机跑通了（同学实测 + 黑窗口修复），那两条理由
  #  都不成立，于是两道门拆掉一道、留一道：
  #
  #  * tag 推送会跑，产物随 Release 发出去。
  #  * 手动 dispatch 仍要显式勾 `build_windows` —— 否则每次只想验证 Linux
  #    四架构都会多挂一个 Windows job，噪声正好盖住真正要看的信号。
  #
  #  **只出 AMD x86_64。** Windows on ARM 跑的是 x64 版（系统自带模拟）——
  #  PyQt5 全系没有 `win_arm64` 轮子（PyPI 上 5.15.11 只有 win32 / win_amd64，
  #  PyQt5-Qt5 的 Windows 轮子停在 5.15.2），原生打包无从谈起。runner 那边
  #  倒是现成的（`windows-11-arm`，公共仓库免费），卡的是依赖不是 CI。
  # ============================================================
  windows:
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && inputs.build_windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build C++ engine
        # 与 Linux 侧同样的理由：不把引擎带进包，4/5 档就退回本地 Python
        # 参考实现。Windows 上 CMake 与 MSVC 是 runner 自带的。
        run: |
          cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build --config Release -j
          # **`.\` 不能省。** PowerShell 与 bash 不同：它不把当前目录放进
          # 可执行文件的搜索路径，`cpp\build\...` 会被当成模块名去 Import，
          # 报 "The module 'cpp' could not be loaded"（这一步曾经编译失败时
          # 顺带暴露了它，两处都是第一次在这套流程上真跑）。
          .\cpp\build\Release\gomoku_engine.exe --verify-tables --selftest

      - name: Resolve version
        shell: pwsh
        run: |
          $raw = '${{ github.ref_name }}'
          # 与 build-linux 那条逐字同构：只取开头的 x.y.z，tag 后缀不进版本号。
          $ver = if ($raw -match '^v?(\d+\.\d+\.\d+)') { $Matches[1] }
                 elseif ($raw -match '^v?(\d+)') { $Matches[1] }
                 else { '0.0.0' }
          "APP_VERSION=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "版本号: $ver（tag: $raw）"

      - name: Build onedir (installer payload, play)
        # 安装包装的是 **play** —— 普通用户那边不该堆 game_log。
        #
        # `--paths` 指向一个只存在于 runner 临时目录里的文件夹，里面是我们
        # 现写的一行模块。变体在**构建期**烘焙，不在运行时按文件名倒推，
        # 理由见 gamelog.py 顶部那段。`-Encoding ascii`：内容纯 ASCII，
        # 也躲开 Windows PowerShell 那句 `utf8` 会写 BOM 的老毛病。
        shell: pwsh
        run: |
          $flavorDir = Join-Path $env:RUNNER_TEMP "build-flavor"
          New-Item -ItemType Directory -Force -Path $flavorDir | Out-Null
          Set-Content -Path "$flavorDir\_build_flavor.py" `
            -Value 'FLAVOR = "play"' -Encoding ascii
          pyinstaller --onedir --windowed --icon="五子棋.ico" --name "GomokuAI" `
            --paths $flavorDir `
            --add-binary "cpp\build\Release\gomoku_engine.exe;." main.py

      - name: "Build portable (onefile: debug + play)"
        shell: pwsh
        run: |
          $flavorDir = Join-Path $env:RUNNER_TEMP "build-flavor"
          New-Item -ItemType Directory -Force -Path $flavorDir | Out-Null
          foreach ($f in @("debug", "play")) {
            $exe = "GomokuAI_Windows_amd_x86_64_run_$f"
            Set-Content -Path "$flavorDir\_build_flavor.py" `
              -Value "FLAVOR = `"$f`"" -Encoding ascii
            pyinstaller --onefile --windowed --icon="五子棋.ico" --name $exe `
              --paths $flavorDir `
              --add-binary "cpp\build\Release\gomoku_engine.exe;." main.py
            if (-not (Test-Path "dist\$exe.exe")) { throw "PyInstaller 没有产出 $exe.exe" }
          }

      - name: Assert the flavor module got bundled
        # 与 Linux 侧那条断言同一个理由，也是这套机制**唯一会静默失败**的地方：
        # `--paths` 若没生效，gamelog.py 里那个 try 会把它当 ImportError 吞掉，
        # debug 版就退化成 play —— 不报错、不崩，用户开一局之后才发现日志没出来。
        #
        # 查的是 PyInstaller 自己写下的分析产物（`build\<name>\*.toc` 里列着
        # 收进去的模块名），不是最终二进制：onefile 的 PYZ 压过，直接 grep 一个
        # 字符串既可能假阴也可能假阳。
        shell: pwsh
        run: |
          foreach ($f in @("debug", "play")) {
            $name = "GomokuAI_Windows_amd_x86_64_run_$f"
            $hit = Get-ChildItem "build\$name" -Recurse -Filter *.toc |
                   Select-String -Pattern '_build_flavor' -List
            if (-not $hit) {
              throw "$name 的分析产物里没有 _build_flavor —— --paths 没生效，" +
                    "照这样发出去 debug 版会静默退化成 play"
            }
          }
          Write-Host "两个变体都带上了 _build_flavor"

      - name: Install Inno Setup
        # choco 装的是当前最新版。**不假设它带简体中文语言文件** —— Inno
        # Setup 从 6.3 起才官方收录 ChineseSimplified.isl，而 `MessagesFile`
        # 指向不存在的文件是编译期硬错，猜错的代价是整步失败。
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC：$iscc" }

          $isccArgs = @("/DAppVersion=$env:APP_VERSION")
          if (Test-Path (Join-Path (Split-Path $iscc -Parent) "Languages\ChineseSimplified.isl")) {
            Write-Host "编译器自带中文语言文件，安装向导显示中文"
            $isccArgs += "/DHasChinese=1"
          } else {
            Write-Warning "编译器没有 ChineseSimplified.isl，安装向导退回英文"
          }
          $isccArgs += "installer\GomokuAI.iss"

          & $iscc @isccArgs
          $setup = Get-ChildItem "dist-installer\GomokuAI_Windows_amd_x86_64_setup.exe"
          if (-not $setup) { throw "ISCC 退出码为 0 却没有产出安装包" }
          $setup | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows_amd_x86_64_setup
          path: dist-installer/GomokuAI_Windows_amd_x86_64_setup.exe

      - name: Upload portable (debug)
        uses: actions/upload-artifact@v4
        with:
          name: windows_amd_x86_64_run_debug
          path: dist/GomokuAI_Windows_amd_x86_64_run_debug.exe

      - name: Upload portable (play)
        uses: actions/upload-artifact@v4
        with:
          name: windows_amd_x86_64_run_play
          path: dist/GomokuAI_Windows_amd_x86_64_run_play.exe


  # ============================================================
  #  GitHub Release (仅 tag 推送时触发)
  # ============================================================
  release:
    # `test` 必须在这里 —— 否则测试挂了照样能发版（four build job 都不依赖它，
    # 而 `softprops/action-gh-release` 也不看测试结果）。CI 跑的是
    # `-m "not perf"`，所以这条闸门不受 runner 快慢影响。
    needs:
      - test
      - build-linux
      - windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: List release files
        run: ls -lah release/

      - name: Assert the release holds exactly these 15 assets
        # **数一遍再发。** 五个 build job 里任何一个被跳过（`if` 写错、架构
        # 不可用）都不会让这个 job 失败 —— `needs` 只保证"跑过的那些成功"，
        # 挡不住"某一条压根没跑"。少了产物的 Release 会静默地只发 6 个，
        # 用户下不到自己架构那份，而错误现场在几周后才会出现。
        #
        # **这里是 15 个名字逐个写死的，不是通配符。** 早先那版是
        # `for s in AMD ARM X86 ARM32; do [ -e "release/GomokuAI_For_Linux_$s" ] …`
        # 那一套，两处都踩过：① 匹配用的是 `"…$s".*`，而 `.*` 是在**当前目录**
        # （$GITHUB_WORKSPACE，本 job 没有 checkout，因而是空目录）里展开的，
        # 没有匹配就原样留成一个字面量 `*`，`-e` 永远为假 —— 8 个资产**明明
        # 全在**，发布会栽在一条假报警上（v3.0.1 首次实跑就是这么红的）；
        # ② 就算把前缀补对，`.*` 也放过了任何后缀，`.deb` 换成 `.rpm` 照样
        # 绿。逐个写死两个毛病一起消掉：名字、后缀、数量全在一条 `diff` 里。
        run: |
          want=$(printf '%s\n' \
            GomokuAI_Linux_amd_x86_64_run_debug \
            GomokuAI_Linux_amd_x86_64_run_play \
            GomokuAI_Linux_amd_x86_64_setup.deb \
            GomokuAI_Linux_amd_x32_run_debug \
            GomokuAI_Linux_amd_x32_run_play \
            GomokuAI_Linux_amd_x32_setup.deb \
            GomokuAI_Linux_aarch64_run_debug \
            GomokuAI_Linux_aarch64_run_play \
            GomokuAI_Linux_aarch64_setup.tar.gz \
            GomokuAI_Linux_armv7_run_debug \
            GomokuAI_Linux_armv7_run_play \
            GomokuAI_Linux_armv7_setup.tar.gz \
            GomokuAI_Windows_amd_x86_64_run_debug.exe \
            GomokuAI_Windows_amd_x86_64_run_play.exe \
            GomokuAI_Windows_amd_x86_64_setup.exe | sort)
          got=$(ls -1 release/ | sort)
          echo "Release 资产：$(printf '%s\n' "$got" | wc -l) 个"
          printf '%s\n' "$got"
          if [ "$want" != "$got" ]; then
            echo "!! Release 资产与预期不符" >&2
            diff <(printf '%s\n' "$want") <(printf '%s\n' "$got") >&2 || true
            echo "   （左 = 应有，右 = 实际；两平台 × (1 安装包 + 2 裸可执行)，Linux 四架构 + Windows 一架构 = 15）" >&2
            exit 1
          fi
          echo "15 个资产齐全：Linux 四架构与 Windows 各一份安装包 + debug/play 两份裸可执行文件"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ github.ref_name }}"
          # `body` 与 `generate_release_notes` 同时给：GitHub 把自动生成的
          # 变更清单**接在** body 后面，所以这段说明排在 Release 页最上方。
          body: |
            Windows 与 Linux 都是稳定版；没有 macOS 版。

            ### 每个平台三份

            | 文件 | 是什么 |
            |---|---|
            | `..._setup.*` | 安装包。装出来的程序**不写日志**，普通用户用这个 |
            | `..._run_play.*` | 免安装单文件，**不写日志** |
            | `..._run_debug.*` | 免安装单文件，**写日志**到 exe 同目录（`game_log_*.txt`） |

            debug 是给人看现场的：出问题时下这一份，日志就在 exe 旁边。

            | 平台 | 可选架构 | 安装包 |
            |---|---|---|
            | Linux | `amd_x86_64` / `amd_x32` / `aarch64` / `armv7` | `.deb`（x86 系）或 `.tar.gz`（ARM 系，解包后 `sudo ./install.sh`） |
            | Windows | `amd_x86_64` | `.exe`，装到 `%LOCALAPPDATA%\GomokuAI`，不需要管理员权限 |

            裸文件下载后要自己给可执行位（Release 资产不携带文件权限）：
            `chmod +x GomokuAI_Linux_amd_x86_64_run_play`。

            **Windows on ARM 请下 x64 版**（系统自带模拟）—— PyQt5 没有 ARM64
            的轮子，做不出原生的 ARM 包。
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
